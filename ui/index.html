<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover operator</title>
<style>
  body { font: 1rem system-ui; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  input, button { font: inherit; padding: .5rem; }
  input { width: min(100%, 30rem); box-sizing: border-box; }
  img { width: min(100%, 640px); height: auto; aspect-ratio: 4 / 3; object-fit: contain; background: #222; border-radius: 12px; }
  #view-toggle { margin-bottom: 1rem; }
  #mode { font-weight: bold; }
  .scenario-switch { display: inline-flex; gap: .25rem; padding: .25rem; border: 1px solid #777; border-radius: .55rem; }
  .scenario-switch[hidden] { display: none; }
  .scenario-switch a { color: inherit; padding: .45rem .7rem; border-radius: .35rem; }
  .scenario-switch [aria-current="page"] { background: #282343; color: #fff; text-decoration: none; }
</style>
<main>
  <h1>Rover operator</h1>
  <nav id="scenario-switch" class="scenario-switch" aria-label="Choose a scenario" hidden>
    <a href="/" aria-current="page">Scenario 1</a>
    <a href="http://127.0.0.1:8113/jury">Scenario 2</a>
  </nav>
  <p id="mode"></p>
  <form id="controls">
    <label for="command">Fetch command</label><br>
    <input id="command" required placeholder="Bring the round red thing">
    <button id="start" disabled>Start</button>
    <button id="reset" type="button" disabled>Reset</button>
  </form>
  <p id="status" role="status"></p>
  <p id="feedback" role="status"></p>
  <button id="view-toggle" type="button" aria-pressed="false" aria-controls="camera">Whole-rover view</button>
  <h2 id="camera-title">Front camera</h2>
  <p id="camera-note"></p>
  <img id="camera" width="640" height="480" alt="Rover front camera" hidden>
</main>
<script src="/operator.js" defer></script>
