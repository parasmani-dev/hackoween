name: Offline regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agent/requirements.txt
      - name: Mocked providers, engine, capture, launcher and motor regressions
        run: python -B -m unittest agent.test_clients agent.test_runner engine.test_run_control simulation.test_launcher simulation.test_capture simulation.test_provenance simulation.test_motor simulation.test_offline_preflight simulation.test_preview integration.docker.test_gateway -v
      - name: Preview health regression
        run: node --test ui/preview.test.mjs
      - name: UI and recording syntax
        run: |
          node --check ui/server.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check ui/operator.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Real Webots and FFmpeg packaging run on the designated demo laptop using
      # integration/offline_preflight.ps1; a green CI job is not that evidence.
